ng by Her Majesty Queen Elizabeth II and French President François Mitterrand.","hist":["La fecha corresponde a la ceremonia oficial. Getlink registra por separado el primer tren comercial de mercancías y el inicio de Eurostar.","The date is for the official ceremony. Getlink lists the first commercial freight train and the start of Eurostar separately."],"translated":["El ejercicio empareja el Eurotúnel con un centro de visitantes. ¿Qué establece la nota final?","La nota menciona el túnel y el centro de visitantes y luego dice solo esto: ya se ha inaugurado oficialmente.","La nota utiliza un solo pronombre que podría referirse tanto al túnel como al centro de visitantes."],"event":"Ceremonial opening of the Channel Tunnel","event_date":"1994-05-06","source":"https://www.getlinkgroup.com/en/our-group/history/","reader":{"key":"3727d80f12","decision":"REVIEW","rationale":"The note uses a single pronoun that could refer to either the tunnel or the visitor centre."},"proposition":"REVIEW","year":"OTHER","neural":"REVIEW","rule_excerpt":"The note names the tunnel and the visitor centre, then says only this: it has been officially opened.","reference":"INDETERMINATE","lines":{"case":19,"reader":43,"rule":115,"event":3,"reference":4}},{"id":"v013","event_id":"sydney_opera","cutoff":"1973-10-10","language":"es","prompt":"¿Cómo interpretarías este apunte breve sobre la Ópera de Sídney?","text":"«Inauguración oficial», seguido de una marca que podría ser una casilla de tarea o un visto bueno de ejecución.","names":["Ópera de Sídney","Sydney Opera House"],"org":"Sydney Opera House","quote":"Australian culture reached a remarkable milestone on 20 October 1973","hist":["La historia de la Ópera sitúa la inauguración oficial el 20 de octubre. El edificio ya había acogido actuaciones durante la construcción.","The Opera House dates its official opening to 20 October. Performances had already taken place during construction."],"translated":["How would you interpret this brief note vent_id":"hamburg_concert","cutoff":"2017-01-06","language":"en","prompt":"How would you resolve the apparent disagreement about the Elbphilharmonie Grand Hall opener?","text":"One account calls it a rehearsal. I disagree: the official opening concert has already been performed.","names":["Filarmónica del Elba","Elbphilharmonie"],"org":"Elbphilharmonie Hamburg","quote":"Wed, 11 Jan 2017 18:30","hist":["El archivo de la sala identifica el concierto de apertura en la gran sala el 11 de enero. El programa se repitió la tarde siguiente.","The venue lists the opening concert in its Grand Hall on 11 January. The programme was repeated the following evening."],"translated":["¿Cómo resolverías el aparente desacuerdo sobre la inauguración de la gran sala de la Filarmónica del Elba?","Una versión lo llama ensayo. No estoy de acuerdo: el concierto inaugural oficial ya se ha interpretado.","Quien responde rechaza la versión del ensayo y afirma que el concierto inaugural oficial ya se ha interpretado."],"event":"First official opening concert in the Elbphilharmonie Grand Hall","event_date":"2017-01-11","source":"https://www.elbphilharmonie.de/en/whats-on/elbphilharmonie-opening/7388","reader":{"key":"7abe25b328","decision":"POST_ASSERTION","rationale":"The speaker rejects the rehearsal account and affirms that the official opening concert has already been performed."},"proposition":"REVIEW","year":"OTHER","neural":"REVIEW","rule_excerpt":"One account calls it a rehearsal.","reference":"POST_ASSERTION","lines":{"case":347,"reader":113,"rule":156,"event":104,"reference":45}}],"commit":"31d50dda0abd05cbfaa11559cd98df7140ab4dd6","version":"1.1","doi":"10.5281/zenodo.24424024","files":{"holdout/cases.json":"d9522257ada3bca4d718e2f502441551c1071793f19f65b27406833ecc4d3a11","holdout/events.json":"c9fb3715e3e6488fe13a51b455ed312834899292ef103835252fd04f82666369","holdout/labels.json":"54fa1ac2e9d7222607e4ccda0e174025437daadd917fe8985062c6271b869445","reader/answers.json":"ed19141ded1ef0 d, provenance and limits',methodText:'These six cases come from a challenge of 48 texts authored in English and Spanish. A single dataset author assigned the reference labels. The later AI reading received shuffled cases and event dates, with the reference labels and rule predictions withheld.',limits:'Across all 48 cases, the archived reader matched the 42 determinate references and referred the six indeterminate ones for review. This was one internal reading. Its model version and sampling settings are unattested. The selection on this page emphasises disagreements and ambiguities. It does not measure human performance, real-world error prevalence or the causal origin of a response.',caseFile:'Case data',protocol:'Reader protocol',doi:'Study edition on Zenodo',back:'← Return to this case in the paper',pilot:'Run a blind 16-case pilot',pilotNote:'Voluntary, decentralised pilot. Each group holds its own decisions. This demo does not register participants or send annotations.',rule:'Proposition rule',picked:'Recorded',before:'before viewing the reading',after:'after viewing the reading',need:'Choose one of the three options.',empty:'Annotation cleared from this tab.',showing:'of 48 challenge cases',original:'Original',translation:'Editorial translation',version:'Study 1.1 · 21 November 2026 · commit',agree:'Your recorded decision matches the authored reference.',differ:'Your recorded decision differs from the authored reference.',changes:'You have unrecorded changes.',pre:'First decision',latest:'Latest decision',class:{POST_ASSERTION:'Asserts a post-cutoff event',OTHER:'Other response',REVIEW:'Refer for review',INDETERMINATE:'Indeterminate'},routing:{POST_ASSERTION:'Alert',OTHER:'No alert',REVIEW:'Referred for review'}}
};
const qs=new URLSearchParams(location.search);
const chosenLocale=qs.get('lang')||document.documentElement.dataset.paperLocale;
let lang=['es','en'].includes(chosenLocale)?chosenLocale:(location.pathname.split('/').includes('es')?'es':location.protocol==='file:'?'es':'en');
let cid=DATA.cases.some(c=>c.id===qs.get('case'))?qs.get('case'):DATA.cases[0].id;
const memory=new Map(), base='https://github.com/joinsnipe/SPE_AUDIT/blob/'+DATA.commit+'/research/temporal-audit/v11/';
const caseObj=()=>DATA.cases.find(c=>c.id===cid), bin=()=>lang==='es'?0:1, L=()=>T[lang];
const radios=[$('positive'),$('other'),$('indet')];
function state(){if(!memory.has(cid))memory.set(cid,{note:'',pick:'',first:null,last:null,revealed:false,seen:false});return memory.get(cid)}
function setText(id,value){$(id).textContent=value}
function link(id,path,line){$(id).href=base+path+(line?'#L'+line:'')}
function updateUrl(){try{const dest=new URL(location.href);dest.searchParams.set('case',cid);dest.searchParams.set('lang',lang);history.replaceState(null,'',dest.href)}catch(e){}}
function verdict(){return radios.find(r=>r.checked)?.value||''}
function remember(){const s=state();s.pick=verdict();s.note=$('note').value}
function annotateStatus(){
 const s=state(), t=L();let msg='';
 if(s.last){const line=(label,x)=>label+' · '+t.class[x.value]+' · '+(x.seen?t.after:t.before);
 msg=line(t.pre,s.first);if(s.first.value!==s.last.value||s.first.seen!==s.last.seen)msg+=' / '+line(t.latest,s.last);}
 if(s.last&&(s.pick!==s.last.value||s.note!==s.last.note))msg+=' '+t.changes;
 setText('localStatus',msg);setText('compare',s.last?(s.last.value===caseObj().reference?t.agree:t.differ):'');
}
function render(){
 const c=caseObj(), t=L(),s=state(),n=bin();document.documentElement.lang=lang;document.title=t.heading+' · SPE Audit';
 for(const key of ['skip','heading','intro','exposure','caseLabel','promptLabel','responseLabel','translationButton','traceButton','clauseExplain','traceFile','historyTitle','cutLabel','eventLabel','quotation','noSource','yourTitle','yourHelp','yourQuestion','posText','otherText','indetText','noteLabel','save','clear','readingTitle','revealHelp','readerLabel','refLabel','neuralLabel','yearLabel','rationaleLabel','readerLink','referenceLink','methodTitle','methodText','limits','caseFile','protocol','doi','back','pilot','pilotNote'])setText(key,t[key]);
 for(const k of ['es','en'])$(k).setAttribute('aria-pressed',String(k===lang));
 $('case').replaceChildren();for(const item of DATA.cases){const op=document.createElement('option');op.value=item.id;op.textContent=item.names[n]+' · '+item.id;$('case').appendChild(op)}$('case').value=cid;
 setText('caseCount',DATA.cases.length+' '+t.showing);setText('caseId',cid);setText('caseTitle',c.names[n]);setText('originalLang',t.original+' · '+c.language.toUpperCase());
 setText('flag',t.rule+' · '+t.routing[c.proposition]);$('flag').dataset.status=c.proposition;
 setText('prompt',c.prompt);setText('response',c.text);setText('clause',c.rule_excerpt);for(const id of ['prompt','response','clause'])$(id).lang=c.language;
 $('translated').hidden=c.language===lang;setText('tPrompt',c.translated[0]);setText('tAnswer',c.translated[1]);
 $('cut').dateTime=c.cutoff;setText('cut',c.cutoff);$('eventDate').dateTime=c.event_date;setText('eventDate',c.event_date);
 setText('hist',c.hist[n]);setText('sourceQuote',c.quote);setText('primary',c.org+' ↗');$('primary').href=c.source;
 for(const r of radios)r.checked=r.value===s.pick;$('note').value=s.note;
 $('archived').hidden=!s.revealed;$('reveal').setAttribute('aria-expanded',String(s.revealed));setText('reveal',s.revealed?t.hide:t.reveal);
 setText('readerResult',t.class[c.reader.decision]);setText('reference',t.class[c.reference]);setText('neural',t.class[c.neural]);setText('yearRule',t.class[c.year]);setText('rationale',c.reader.rationale);$('rationale').lang=c.language;
 $('rationaleTranslation').hidden=c.language===lang;setText('rationaleTranslation',t.translation+' · '+c.translated[2]);setText('version',t.version+' '+DATA.commit.slice(0,12));
 link('caseFile','holdout/cases.json',c.lines.case);link('traceFile','results/predictions.jsonl',c.lines.rule);
 link('readerLink','reader/answers.json',c.lines.reader);link('referenceLink','holdout/labels.json',c.lines.reference);link('protocol','reader/protocol.md');$('doi').href='https://doi.org/'+DATA.doi;
 $('back').href=(location.protocol==='file:'?'https://www.spetrace.com':'')+(lang==='es'?'/es':'')+'/research/temporal-audit?case='+cid+'#casebook';annotateStatus();
}
$('case').onchange=()=>{remember();cid=$('case').value;for(const id of ['trace','translated'])$(id).open=false;updateUrl();render()};
for(const k of ['es','en'])$(k).onclick=()=>{remember();lang=k;updateUrl();render()};
$('reveal').onclick=()=>{remember();const s=state();s.revealed=!s.revealed;if(s.revealed)s.seen=true;render()};
$('save').onclick=()=>{remember();const s=state();if(!s.pick){setText('localStatus',L().need);radios[0].focus();return}
 const v={value:s.pick,note:s.note,seen:s.seen};if(!s.first)s.first={...v};s.last=v;annotateStatus()};
$('clear').onclick=()=>{const s=state();s.pick='';s.note='';s.first=null;s.last=null;render();setText('localStatus',L().empty)};
for(const r of radios)r.onchange=()=>{remember();annotateStatus()};$('note').oninput=()=>{remember();annotateStatus()};
render();
</script></body></html>
