<script>

const locales={es:{skip:'Ir a los casos',head:'¿La respuesta sabía demasiado?',lead:'Un año futuro puede aparecer en un pronóstico honesto. Explora ocho respuestas de prueba y comprueba qué documentos estaban disponibles en cada fecha. Las frases fueron redactadas para este estudio.',chooselabel:'Elige un caso',quoteLabel:'Respuesta de prueba · traducción al español',yearName:'Detector de años',matchedName:'Comparador con fechas',refName:'Etiqueta de referencia',sourceHead:'Fuentes admitidas por fecha',traceLabel:'Inspeccionar la captura',hash:'Comprobar las huellas',metricsTitle:'Resultados del estudio completo',metricsDesc:'Los cocientes muestran cuántas afirmaciones posteriores al corte detectó cada método de entre todas las que contenía el conjunto.',thSet:'Conjunto',thYear:'Detector de años',thComp:'Comparador',thReview:'Sin decidir (comparador)',legend:'La última columna cuenta todas las abstenciones, incluidos los controles. Las etiquetas se asignaron durante la preparación del estudio. La evaluación carece de una segunda anotación independiente. Ninguna cifra mide la frecuencia de filtraciones en productos reales.',paper:'Artículo en español',csv:'Predicciones (CSV)',jsonl:'Capturas (JSONL)',status:{POST_ASSERTION:'Afirma un desenlace posterior',OTHER:'Sin señal de desenlace posterior',REVIEW:'Requiere revisión'},set:{constructed:'Casos base',challenge:'Desafío de redacción'},cutoff:'Corte',original:'Original en inglés',req:'Pregunta original',event:'Fecha del suceso contrastado',scope:'Se comparan los bytes de la petición, la respuesta y el registro local con las huellas archivadas. Para detectar modificaciones del paquete completo se necesita una huella de confianza obtenida por otra vía. Esta comprobación no identifica lo que procesó un proveedor externo ni por qué se produjo una frase.',pass:'Coinciden las tres huellas guardadas.',fail:'La comprobación ha fallado.',unavailable:'Este navegador no ofrece SHA-256 en este contexto. Puedes comprobar el paquet en:{skip:'Skip to cases',head:'Did the answer know too much?',lead:'A future year can appear in an honest forecast. Explore eight test responses and inspect which documents were eligible on each date. The sentences were written for this study.',chooselabel:'Choose a case',quoteLabel:'Test response · original English',yearName:'Year detector',matchedName:'Dated phrase matcher',refName:'Reference label',sourceHead:'Sources admitted by date',traceLabel:'Inspect the capture',hash:'Check the digests',metricsTitle:'Results across the full study',metricsDesc:'The fractions show how many assertions of later outcomes each method flagged out of all such assertions in each set.',thSet:'Set',thYear:'Year detector',thComp:'Matcher',thReview:'Deferred by matcher',legend:'The last column counts all abstentions, including controls. Reference labels were assigned while preparing the study. There was no independent second annotation. These figures do not measure leakage prevalence in deployed products.',paper:'Read the paper in English',csv:'Predictions (CSV)',jsonl:'Captures (JSONL)',status:{POST_ASSERTION:'Asserts a later outcome',OTHER:'No later-outcome flag',REVIEW:'Needs review'},set:{constructed:'Primary fixtures',challenge:'Wording challenge'},cutoff:'Cutoff',original:'Original English',req:'Original question',event:'Date of documented event',scope:'The recorded request, output and local record bytes are compared against the archived digests. Detecting replacement of the whole package requires a trusted digest from a separate source. This check cannot identify what an external provider processed or what caused an answer.',pass:'All three archived digests match.',fail:'Digest verification failed.',unavailable:'This browser does not offer SHA-256 here. The study’s Python tool can verify the package.',title:'SPE Audit · Did the answer know too much?'}};
let lang='es', ix=0, run=0;

function writeCase(){
 run++; const item=DATA.cases[ix], l=locales[lang], n=lang==='es'?0:1, req=JSON.parse(item.cap.request_utf8);$('hashStatus').textContent='';
 $('meta').textContent=[item.name,l.cutoff+' '+item.cutoff,l.set[item.split]].join('   ·   ');

async function check(){
 const here=++run, item=DATA.cases[ix],l=locales[lang];if(!globalThis.crypto?.subtle){$('hashStatus').textContent=l.unavailable;return}
